<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bow Joe">
<title>Bow Joe</title>
<style>
  :root{
    --ink:#1E2A2F; --ink-soft:#4C5B60; --bg:#EEF1EF; --card:#FFFFFF; --line:#DCE0DC;
    --accent:#3E6B89; --accent-soft:#E4EDF1; --gold:#C1841F; --gold-soft:#F5E9D4;
    --green:#3E6B2C; --green-soft:#E4EFDD; --danger:#B3462C; --danger-soft:#F5E4DE; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:Georgia,"Noto Serif Thai",serif;font-weight:600;margin:0;}
  #app{padding-bottom:calc(72px + env(safe-area-inset-bottom));display:none;}
  .app-header{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 20px 10px;border-bottom:1px solid var(--line);}
  .app-header h1{font-size:21px;}
  .app-header p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  main{padding:16px 16px 8px;max-width:520px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .section-title{font-size:15px;font-weight:600;margin-bottom:10px;}
  button{font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;cursor:pointer;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px;}
  button.danger-ghost{background:transparent;border-color:transparent;color:var(--danger);padding:6px 8px;font-size:13px;}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
  label{font-size:12.5px;color:var(--ink-soft);display:block;margin:0 0 4px 3px;}
  .field{margin-bottom:12px;}
  .fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(30,42,47,0.28);z-index:15;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,0.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px);}
  .tabbar button{flex:1;border:none;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--ink-soft);font-size:10.5px;}
  .tabbar button.active{color:var(--accent);}
  .tabbar .icon{font-size:19px;}
  .tabbar .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .tabbar button.active .dot{background:var(--accent);}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .cat-home{background:var(--accent-soft);color:#2A5471;}
  .cat-car{background:var(--danger-soft);color:#8C3A22;}
  .cat-other{background:#EAEAE6;color:#55554E;}
  .cat-water{background:var(--accent-soft);color:#2A5471;}
  .cat-elec{background:var(--gold-soft);color:#8A5B12;}
  .cat-common{background:#EFE3EF;color:#6E4270;}
  .empty{text-align:center;padding:32px 16px;color:var(--ink-soft);font-size:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,26,28,0.42);display:flex;align-items:flex-end;justify-content:center;z-index:30;}
  .modal{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;}
  .modal h3{margin-bottom:16px;font-size:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{flex:1;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-grid .dow{font-size:11px;color:var(--ink-soft);padding-bottom:4px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;position:relative;}
  .cal-day.other{color:#C3C7C3;}
  .cal-day.today{background:var(--accent);color:#fff;font-weight:700;}
  .cal-day .mark{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--gold);}
  .cal-day.today .mark{background:#fff;}
  .list-item{padding:11px 0;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .amount{font-weight:700;font-size:15px;}
  .sub-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .sub-tabs button{white-space:nowrap;padding:7px 13px;font-size:13px;}
  .sub-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .status{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:10px 0;}
  .metric{background:var(--accent-soft);border-radius:var(--radius);padding:14px;}
  .metric .num{font-size:22px;font-weight:700;color:var(--ink);}
  .metric .lab{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .todo-check{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#fff;}
  .todo-check.done{background:var(--green);border-color:var(--green);}
  .badge-tenant{font-size:12px;color:var(--ink-soft);}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .login-box h1{font-size:24px;margin-bottom:6px;}
  .login-box p{color:var(--ink-soft);font-size:14px;margin:0 0 24px;}
  .login-box input{text-align:center;letter-spacing:4px;font-size:20px;padding:12px;margin-bottom:12px;}
  .login-box button{width:100%;padding:12px;}
  .login-error{color:var(--danger);font-size:13px;margin-bottom:10px;min-height:16px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Bow Joe</h1>
    <p>ใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
    <div class="login-error" id="login-error"></div>
    <input type="password" inputmode="numeric" id="login-input" placeholder="รหัสผ่าน">
    <button class="primary" id="login-btn">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="app">
  <div class="app-header">
    <h1 id="header-title">Bow Joe</h1>
    <p id="header-sub">ภาพรวมของวันนี้</p>
  </div>
  <main id="main"></main>
  <button class="fab" id="fab" aria-label="เพิ่มรายการ">+</button>
  <div class="tabbar">
    <button data-tab="home" class="active"><span class="icon">🏠</span><span>หน้าแรก</span><span class="dot"></span></button>
    <button data-tab="calendar"><span class="icon">📅</span><span>ปฏิทิน</span><span class="dot"></span></button>
    <button data-tab="condo"><span class="icon">🏢</span><span>คอนโด</span><span class="dot"></span></button>
    <button data-tab="expenses"><span class="icon">💵</span><span>รายจ่าย</span><span class="dot"></span></button>
    <button data-tab="notes"><span class="icon">📝</span><span>โน้ต</span><span class="dot"></span></button>
  </div>
</div>

<div id="modal-root"></div>

<script>
/* เปลี่ยนรหัสผ่านตรงนี้ได้เลย ให้ทั้งสองคนรู้รหัสเดียวกัน */
const PASSCODE = "089940";

const EXPENSE_CATS = [
  {id:'home', name:'Home', cls:'cat-home'},
  {id:'car', name:'Car', cls:'cat-car'},
  {id:'other', name:'Other', cls:'cat-other'},
];
const BILL_TYPES = [
  {id:'water', name:'ค่าน้ำ', cls:'cat-water'},
  {id:'elec', name:'ค่าไฟ', cls:'cat-elec'},
  {id:'common', name:'ส่วนกลาง', cls:'cat-common'},
  {id:'other', name:'Other', cls:'cat-other'},
];
const PAYERS = ['JOE','BOW','TGT'];
const HEADER_SUB = {
  home:'ภาพรวมของวันนี้', calendar:'ตารางเวลาร่วมกัน', condo:'จัดการห้องปล่อยเช่า',
  expenses:'บันทึกค่าใช้จ่าย', notes:'สิ่งที่ต้องจำและต้องทำ'
};
const HEADER_TITLE = {
  home:'Home', calendar:'Calendar', condo:'Condo', expenses:'Expenses', notes:'Notes'
};

let state = { events:[], tenant:{}, income:[], bills:[], expenses:[], notes:[] };
let tab = 'home';
let condoSub = 'tenant';
let calMonth = new Date();
let ready = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(d){ if(!d) return ''; return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}); }
function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function thisMonthKey(){ return new Date().toISOString().slice(0,7); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function catInfo(list,id){ return list.find(c=>c.id===id) || list[list.length-1]; }

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
function doLogin(){
  const v = document.getElementById('login-input').value;
  if(v === PASSCODE){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAll();
  }else{
    document.getElementById('login-error').textContent = 'รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง';
  }
}

async function loadAll(){
  const map = { events:'v2-events', tenant:'v2-condo-tenant', income:'v2-condo-income',
    bills:'v2-condo-bills', expenses:'v2-expenses', notes:'v2-notes' };
  for(const k in map){
    try{
      const r = await window.storage.get(map[k], true);
      state[k] = r ? JSON.parse(r.value) : (k==='tenant' ? {} : []);
    }catch(e){ state[k] = (k==='tenant' ? {} : []); }
  }
  ready = true;
  render();
}
async function saveKey(k){
  const map = { events:'v2-events', tenant:'v2-condo-tenant', income:'v2-condo-income',
    bills:'v2-condo-bills', expenses:'v2-expenses', notes:'v2-notes' };
  try{ await window.storage.set(map[k], JSON.stringify(state[k]), true); }
  catch(e){ document.getElementById('header-sub').textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'; }
}

document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tab = btn.dataset.tab;
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('header-title').textContent = HEADER_TITLE[tab];
    document.getElementById('header-sub').textContent = HEADER_SUB[tab];
    render();
  });
});
document.getElementById('fab').addEventListener('click', ()=>{
  if(tab==='calendar') openEventModal();
  else if(tab==='condo'){
    if(condoSub==='tenant') openTenantModal();
    else if(condoSub==='income') openIncomeModal();
    else openBillModal();
  }
  else if(tab==='expenses') openExpenseModal();
  else if(tab==='notes') openNoteModal();
});

function render(){
  const main = document.getElementById('main');
  document.getElementById('fab').style.display = (tab==='home') ? 'none' : 'flex';
  if(!ready){ main.innerHTML = '<div class="status">กำลังโหลดข้อมูล...</div>'; return; }
  if(tab==='home') main.innerHTML = renderHome();
  else if(tab==='calendar') main.innerHTML = renderCalendar();
  else if(tab==='condo') main.innerHTML = renderCondo();
  else if(tab==='expenses') main.innerHTML = renderExpenses();
  else main.innerHTML = renderNotes();
  attachDynamicListeners();
}

/* ---------- HOME ---------- */
function renderHome(){
  const mk = thisMonthKey();
  const monthExpenses = state.expenses.filter(e=>e.date && e.date.slice(0,7)===mk).reduce((s,e)=>s+Number(e.amount),0);
  const monthBills = state.bills.filter(b=>b.month===mk).reduce((s,b)=>s+Number(b.amount),0);
  const rentPaidThisMonth = state.income.some(i=>i.month===mk);
  const today = todayStr();
  const upcoming = [...state.events].filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  const openTodos = state.notes.filter(n=>n.type==='todo' && !n.done);

  return `
    <div class="grid2" style="margin-bottom:12px;">
      <div class="metric"><div class="num">฿${fmtMoney(monthExpenses+monthBills)}</div><div class="lab">ค่าใช้จ่ายรวมเดือนนี้</div></div>
      <div class="metric" style="background:${rentPaidThisMonth?'var(--green-soft)':'var(--danger-soft)'};">
        <div class="num">${rentPaidThisMonth?'รับแล้ว':'ยังไม่รับ'}</div>
        <div class="lab">ค่าเช่าคอนโดเดือนนี้</div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">กำหนดการใกล้ถึง</div>
      ${upcoming.length ? upcoming.map(e=>`
        <div class="list-item"><div style="font-weight:600;">${escapeHtml(e.title)}</div><div class="muted">${fmtDate(e.date)}</div></div>
      `).join('') : `<div class="empty">ไม่มีกำหนดการเร็วๆ นี้</div>`}
    </div>
    <div class="card">
      <div class="section-title">สิ่งที่ต้องทำค้างอยู่ (${openTodos.length})</div>
      ${openTodos.length ? openTodos.slice(0,5).map(n=>`
        <div class="list-item">${escapeHtml(n.title)}</div>
      `).join('') : `<div class="empty">ไม่มีสิ่งที่ต้องทำค้างอยู่</div>`}
    </div>
    <div class="muted" style="text-align:center;padding:4px 0 12px;">หน้านี้เป็นแบบร่าง บอกได้เลยว่าอยากให้แสดงอะไรเพิ่ม/ตัดออก</div>
  `;
}

/* ---------- CALENDAR ---------- */
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1), startOffset=first.getDay(), daysInMonth=new Date(y,m+1,0).getDate();
  const monthLabel = calMonth.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const dows=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const today = todayStr();
  let cells='';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day other"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasEvent = state.events.some(e=>e.date===dateStr);
    cells += `<div class="cal-day ${dateStr===today?'today':''}">${d}${hasEvent?'<span class="mark"></span>':''}</div>`;
  }
  const upcoming = [...state.events].filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,20);
  return `
    <div class="card">
      <div class="row" style="margin-bottom:12px;">
        <button class="ghost" id="prev-month">‹ ก่อนหน้า</button>
        <h3>${monthLabel}</h3>
        <button class="ghost" id="next-month">ถัดไป ›</button>
      </div>
      <div class="cal-grid">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    </div>
    <div class="card">
      <div class="section-title">กำหนดการที่จะถึง</div>
      ${upcoming.length ? upcoming.map(e=>`
        <div class="list-item"><div class="row">
          <div><div style="font-weight:600;">${escapeHtml(e.title)}</div><div class="muted">${fmtDate(e.date)}${e.note?' · '+escapeHtml(e.note):''}</div></div>
          <button class="danger-ghost" data-del-event="${e.id}">ลบ</button>
        </div></div>
      `).join('') : `<div class="empty">ยังไม่มีกำหนดการ<br>แตะ + เพื่อเพิ่มนัดหมายแรก</div>`}
    </div>
  `;
}

/* ---------- CONDO ---------- */
function renderCondo(){
  const subs = [{id:'tenant',name:'ผู้เช่า'},{id:'income',name:'รายรับ'},{id:'bills',name:'บิลค่าใช้จ่าย'}];
  let body = '';
  if(condoSub==='tenant'){
    const t = state.tenant || {};
    body = `
      <div class="card">
        <div class="row" style="margin-bottom:6px;">
          <div class="section-title" style="margin:0;">ข้อมูลผู้เช่าปัจจุบัน</div>
          <button class="ghost" id="edit-tenant">แก้ไข</button>
        </div>
        ${t.name ? `
          <div class="list-item"><span class="badge-tenant">ชื่อ</span><div style="font-weight:600;">${escapeHtml(t.name)}</div></div>
          <div class="list-item"><span class="badge-tenant">เบอร์ติดต่อ</span><div>${escapeHtml(t.phone||'-')}</div></div>
          <div class="list-item"><span class="badge-tenant">ค่าเช่า/เดือน</span><div class="amount">฿${fmtMoney(t.rent)}</div></div>
          <div class="list-item"><span class="badge-tenant">เริ่มสัญญา</span><div>${fmtDate(t.leaseStart)||'-'}</div></div>
          <div class="list-item"><span class="badge-tenant">สิ้นสุดสัญญา</span><div>${fmtDate(t.leaseEnd)||'-'}</div></div>
          <div class="list-item"><span class="badge-tenant">เงินมัดจำ</span><div>฿${fmtMoney(t.deposit)}</div></div>
        ` : `<div class="empty">ยังไม่มีข้อมูลผู้เช่า<br>แตะ "แก้ไข" เพื่อเพิ่มข้อมูล</div>`}
      </div>`;
  } else if(condoSub==='income'){
    const sorted = [...state.income].sort((a,b)=>b.date.localeCompare(a.date));
    const total = state.income.reduce((s,i)=>s+Number(i.amount),0);
    body = `
      <div class="card"><div class="row"><div class="muted">รวมรายรับทั้งหมด</div><div class="amount" style="font-size:18px;">฿${fmtMoney(total)}</div></div></div>
      <div class="card">
        <div class="section-title">บันทึกรายรับ (ค่าเช่า)</div>
        ${sorted.length ? sorted.map(i=>`
          <div class="list-item"><div class="row" style="align-items:flex-start;">
            <div><div style="font-weight:600;">เดือน ${i.month}</div><div class="muted">${fmtDate(i.date)}${i.note?' · '+escapeHtml(i.note):''}</div></div>
            <div style="text-align:right;"><div class="amount">฿${fmtMoney(i.amount)}</div><button class="danger-ghost" data-del-income="${i.id}">ลบ</button></div>
          </div></div>
        `).join('') : `<div class="empty">ยังไม่มีบันทึกรายรับ<br>แตะ + เพื่อเพิ่มรายการแรก</div>`}
      </div>`;
  } else {
    const sorted = [...state.bills].sort((a,b)=>(b.month||'').localeCompare(a.month||''));
    body = `
      <div class="card">
        <div class="section-title">บิลค่าใช้จ่ายคอนโด</div>
        ${sorted.length ? sorted.map(b=>{
          const c = catInfo(BILL_TYPES,b.type);
          return `
          <div class="list-item"><div class="row" style="align-items:flex-start;">
            <div>
              <span class="pill ${c.cls}">${c.name}</span>
              <div style="margin-top:5px;font-weight:600;">เดือน ${b.month}${b.note?' · '+escapeHtml(b.note):''}</div>
              <div class="muted">${b.paid ? 'จ่ายแล้ว' : 'ยังไม่ได้จ่าย'}</div>
            </div>
            <div style="text-align:right;">
              <div class="amount">฿${fmtMoney(b.amount)}</div>
              <div style="display:flex;gap:4px;justify-content:flex-end;margin-top:4px;">
                <button class="ghost" data-toggle-bill="${b.id}">${b.paid?'ยกเลิกจ่าย':'จ่ายแล้ว'}</button>
                <button class="danger-ghost" data-del-bill="${b.id}">ลบ</button>
              </div>
            </div>
          </div></div>`;
        }).join('') : `<div class="empty">ยังไม่มีบิลค่าใช้จ่าย<br>แตะ + เพื่อเพิ่มรายการแรก</div>`}
      </div>`;
  }
  return `
    <div class="sub-tabs">${subs.map(s=>`<button data-condo-sub="${s.id}" class="${s.id===condoSub?'active':''}">${s.name}</button>`).join('')}</div>
    ${body}
  `;
}

/* ---------- EXPENSES ---------- */
function renderExpenses(){
  const sorted = [...state.expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const total = state.expenses.reduce((s,e)=>s+Number(e.amount),0);
  const mk = thisMonthKey();
  const monthTotal = state.expenses.filter(e=>e.date.slice(0,7)===mk).reduce((s,e)=>s+Number(e.amount),0);
  return `
    <div class="card"><div class="row">
      <div><div class="muted">รวมเดือนนี้</div><div style="font-size:24px;font-weight:700;">฿${fmtMoney(monthTotal)}</div></div>
      <div style="text-align:right;"><div class="muted">รวมทั้งหมด</div><div style="font-size:15px;font-weight:600;">฿${fmtMoney(total)}</div></div>
    </div></div>
    <div class="card">
      <div class="section-title">รายการค่าใช้จ่าย</div>
      ${sorted.length ? sorted.map(e=>{
        const c = catInfo(EXP_CATS,e.category);
        return `
        <div class="list-item"><div class="row" style="align-items:flex-start;">
          <div>
            <span class="pill ${c.cls}">${c.name}</span>
            <div style="margin-top:5px;font-weight:600;">${escapeHtml(e.note||'-')}</div>
            <div class="muted">${fmtDate(e.date)} · จ่ายโดย ${escapeHtml(e.paidBy)}</div>
          </div>
          <div style="text-align:right;"><div class="amount">฿${fmtMoney(e.amount)}</div><button class="danger-ghost" data-del-expense="${e.id}">ลบ</button></div>
        </div></div>`;
      }).join('') : `<div class="empty">ยังไม่มีรายการค่าใช้จ่าย<br>แตะ + เพื่อบันทึกรายการแรก</div>`}
    </div>
  `;
}

/* ---------- NOTES ---------- */
function renderNotes(){
  const sorted = [...state.notes].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return `
    <div class="card">
      <div class="section-title">โน้ตและสิ่งที่ต้องทำ</div>
      ${sorted.length ? sorted.map(n=>`
        <div class="list-item"><div class="row" style="align-items:flex-start;">
          <div style="display:flex;gap:10px;align-items:flex-start;">
            ${n.type==='todo' ? `<span class="todo-check ${n.done?'done':''}" data-toggle-note="${n.id}">${n.done?'✓':''}</span>` : ''}
            <div>
              <div style="font-weight:600;${n.done?'text-decoration:line-through;color:var(--ink-soft);':''}">${escapeHtml(n.title)}</div>
              ${n.detail?`<div class="muted" style="margin-top:2px;white-space:pre-wrap;">${escapeHtml(n.detail)}</div>`:''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
            <button class="ghost" data-edit-note="${n.id}">แก้ไข</button>
            <button class="danger-ghost" data-del-note="${n.id}">ลบ</button>
          </div>
        </div></div>
      `).join('') : `<div class="empty">ยังไม่มีโน้ต<br>แตะ + เพื่อเพิ่มรายการแรก</div>`}
    </div>
  `;
}

/* ---------- LISTENERS ---------- */
function attachDynamicListeners(){
  const prev=document.getElementById('prev-month'), next=document.getElementById('next-month');
  if(prev) prev.addEventListener('click', ()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); });
  if(next) next.addEventListener('click', ()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); });

  document.querySelectorAll('[data-condo-sub]').forEach(b=>b.addEventListener('click', ()=>{ condoSub=b.dataset.condoSub; render(); }));
  const editTenant = document.getElementById('edit-tenant');
  if(editTenant) editTenant.addEventListener('click', openTenantModal);

  document.querySelectorAll('[data-del-event]').forEach(b=>b.addEventListener('click', async ()=>{
    state.events = state.events.filter(e=>e.id!==b.dataset.delEvent); render(); await saveKey('events');
  }));
  document.querySelectorAll('[data-del-income]').forEach(b=>b.addEventListener('click', async ()=>{
    state.income = state.income.filter(i=>i.id!==b.dataset.delIncome); render(); await saveKey('income');
  }));
  document.querySelectorAll('[data-del-bill]').forEach(b=>b.addEventListener('click', async ()=>{
    state.bills = state.bills.filter(x=>x.id!==b.dataset.delBill); render(); await saveKey('bills');
  }));
  document.querySelectorAll('[data-toggle-bill]').forEach(b=>b.addEventListener('click', async ()=>{
    const bill = state.bills.find(x=>x.id===b.dataset.toggleBill);
    if(bill){ bill.paid = !bill.paid; render(); await saveKey('bills'); }
  }));
  document.querySelectorAll('[data-del-expense]').forEach(b=>b.addEventListener('click', async ()=>{
    state.expenses = state.expenses.filter(e=>e.id!==b.dataset.delExpense); render(); await saveKey('expenses');
  }));
  document.querySelectorAll('[data-del-note]').forEach(b=>b.addEventListener('click', async ()=>{
    state.notes = state.notes.filter(n=>n.id!==b.dataset.delNote); render(); await saveKey('notes');
  }));
  document.querySelectorAll('[data-edit-note]').forEach(b=>b.addEventListener('click', ()=>{
    openNoteModal(state.notes.find(n=>n.id===b.dataset.editNote));
  }));
  document.querySelectorAll('[data-toggle-note]').forEach(b=>b.addEventListener('click', async ()=>{
    const n = state.notes.find(x=>x.id===b.dataset.toggleNote);
    if(n){ n.done = !n.done; render(); await saveKey('notes'); }
  }));
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function openEventModal(){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>เพิ่มกำหนดการ</h3>
      <div class="field"><label>วันที่</label><input type="date" id="ev-date" value="${todayStr()}"></div>
      <div class="field"><label>เรื่อง</label><input type="text" id="ev-title" placeholder="เช่น จ่ายค่าคอนโด, นัดหมอ"></div>
      <div class="field"><label>บันทึกเพิ่มเติม (ไม่บังคับ)</label><textarea id="ev-note" rows="2"></textarea></div>
      <div id="ev-error" class="muted" style="color:var(--danger);display:none;">กรอกวันที่และเรื่องก่อนนะ</div>
      <div class="modal-actions"><button id="ev-cancel">ยกเลิก</button><button class="primary" id="ev-save">บันทึก</button></div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('ev-cancel').addEventListener('click', closeModal);
  document.getElementById('ev-save').addEventListener('click', async ()=>{
    const date=document.getElementById('ev-date').value, title=document.getElementById('ev-title').value.trim();
    if(!date||!title){ document.getElementById('ev-error').style.display='block'; return; }
    state.events.push({id:uid(), date, title, note:document.getElementById('ev-note').value.trim(), createdAt:Date.now()});
    closeModal(); render(); await saveKey('events');
  });
}

function openTenantModal(){
  const t = state.tenant || {};
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>ข้อมูลผู้เช่า</h3>
      <div class="field"><label>ชื่อผู้เช่า</label><input type="text" id="tn-name" value="${escapeHtml(t.name||'')}"></div>
      <div class="field"><label>เบอร์ติดต่อ</label><input type="text" id="tn-phone" value="${escapeHtml(t.phone||'')}"></div>
      <div class="field"><label>ค่าเช่าต่อเดือน (บาท)</label><input type="number" id="tn-rent" value="${t.rent||''}"></div>
      <div class="field"><label>เงินมัดจำ (บาท)</label><input type="number" id="tn-deposit" value="${t.deposit||''}"></div>
      <div class="field"><label>วันเริ่มสัญญา</label><input type="date" id="tn-start" value="${t.leaseStart||''}"></div>
      <div class="field"><label>วันสิ้นสุดสัญญา</label><input type="date" id="tn-end" value="${t.leaseEnd||''}"></div>
      <div class="modal-actions"><button id="tn-cancel">ยกเลิก</button><button class="primary" id="tn-save">บันทึก</button></div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('tn-cancel').addEventListener('click', closeModal);
  document.getElementById('tn-save').addEventListener('click', async ()=>{
    state.tenant = {
      name: document.getElementById('tn-name').value.trim(),
      phone: document.getElementById('tn-phone').value.trim(),
      rent: parseFloat(document.getElementById('tn-rent').value)||0,
      deposit: parseFloat(document.getElementById('tn-deposit').value)||0,
      leaseStart: document.getElementById('tn-start').value,
      leaseEnd: document.getElementById('tn-end').value
    };
    closeModal(); render(); await saveKey('tenant');
  });
}

function openIncomeModal(){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>เพิ่มรายรับ (ค่าเช่า)</h3>
      <div class="field"><label>เดือนที่รับ</label><input type="month" id="in-month" value="${thisMonthKey()}"></div>
      <div class="field"><label>วันที่รับ</label><input type="date" id="in-date" value="${todayStr()}"></div>
      <div class="field"><label>จำนวนเงิน (บาท)</label><input type="number" id="in-amount" inputmode="decimal"></div>
      <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input type="text" id="in-note"></div>
      <div id="in-error" class="muted" style="color:var(--danger);display:none;">กรอกจำนวนเงินให้ถูกต้องก่อนนะ</div>
      <div class="modal-actions"><button id="in-cancel">ยกเลิก</button><button class="primary" id="in-save">บันทึก</button></div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('in-cancel').addEventListener('click', closeModal);
  document.getElementById('in-save').addEventListener('click', async ()=>{
    const amount = parseFloat(document.getElementById('in-amount').value);
    if(!amount||amount<=0){ document.getElementById('in-error').style.display='block'; return; }
    state.income.push({id:uid(), month:document.getElementById('in-month').value, date:document.getElementById('in-date').value,
      amount, note:document.getElementById('in-note').value.trim(), createdAt:Date.now()});
    closeModal(); render(); await saveKey('income');
  });
}

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>เพิ่มบิลค่าใช้จ่าย</h3>
      <div class="field"><label>ประเภท</label><select id="bl-type">${BILL_TYPES.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>

      <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input type="text" id="bl-note"></div>
      <div id="bl-error" class="muted" style="color:var(--danger);display:none;">กรอกจำนวนเงินให้ถูกต้องก่อนนะ</div>
      <div class="modal-actions"><button id="bl-cancel">ยกเลิก</button><button class="primary" id="bl-save">บันทึก</button></div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });

  document.getElementById('bl-save').addEventListener('click', async ()=>{
    const amount = parseFloat(document.getElementById('bl-amount').value);
    if(!amount||amount<=0){ document.getElementById('bl-error').style.display='block'; return; }

      amount, paid:false, note:document.getElementById('bl-note').value.trim(), createdAt:Date.now()});

function openExpenseModal(){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>เพิ่มค่าใช้จ่าย</h3>
      <div class="field"><label>ใช้จ่ายกับ</label><select id="ex-cat">${EXP_CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div class="field"><label>จำนวนเงิน (บาท)</label><input type="number" id="ex-amount" inputmode="decimal"></div>
      <div class="field"><label>วันที่</label><input type="date" id="ex-date" value="${todayStr()}"></div>
      <div class="field"><label>จ่ายโดย</label><select id="ex-payer">${PAYERS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select></div>
      <div class="field"><label>รายละเอียด (ไม่บังคับ)</label><input type="text" id="ex-note"></div>
      <div id="ex-error" class="muted" style="color:var(--danger);display:none;">กรอกจำนวนเงินให้ถูกต้องก่อนนะ</div>
      <div class="modal-actions"><button id="ex-cancel">ยกเลิก</button><button class="primary" id="ex-save">บันทึก</button></div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('ex-cancel').addEventListener('click', closeModal);
  document.getElementById('ex-save').addEventListener('click', async ()=>{
    const amount = parseFloat(document.getElementById('ex-amount').value);
    const date = document.getElementById('ex-date').value;
    if(!amount||amount<=0||!date){ document.getElementById('ex-error').style.display='block'; return; }
    state.expenses.push({id:uid(), category:document.getElementById('ex-cat').value, amount, date,
      paidBy:document.getElementById('ex-payer').value, note:document.getElementById('ex-note').value.trim(), createdAt:Date.now()});
    closeModal(); render(); await saveKey('expenses');
  });

function openNoteModal(existing){
  const isEdit = !!existing;
  const n = existing || { type:'note', title:'', detail:'', done:false };
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>${isEdit?'แก้ไขโน้ต':'เพิ่มโน้ต'}</h3>
      <div class="field"><label>ประเภท</label>
        <select id="nt-type">
          <option value="note" ${n.type==='note'?'selected':''}>บันทึกทั่วไป</option>
          <option value="todo" ${n.type==='todo'?'selected':''}>สิ่งที่ต้องทำ</option>
        </select>
      </div>
      <div class="field"><label>หัวข้อ</label><input type="text" id="nt-title" value="${escapeHtml(n.title)}" placeholder="เช่น ต่อประกันรถ"></div>
      <div class="field"><label>รายละเอียด (ไม่บังคับ)</label><textarea id="nt-detail" rows="3">${escapeHtml(n.detail||'')}</textarea></div>
      <div id="nt-error" class="muted" style="color:var(--danger);display:none;">กรอกหัวข้อก่อนนะ</div>
      <div class="modal-actions"><button id="nt-cancel">ยกเลิก</button><button class="primary" id="nt-save">บันทึก</button></div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('nt-cancel').addEventListener('click', closeModal);
  document.getElementById('nt-save').addEventListener('click', async ()=>{
    const title = document.getElementById('nt-title').value.trim();
    if(!title){ document.getElementById('nt-error').style.display='block'; return; }
    const type = document.getElementById('nt-type').value;
    const detail = document.getElementById('nt-detail').value.trim();
    if(isEdit){
      existing.type = type; existing.title = title; existing.detail = detail;
    } else {
      state.notes.push({id:uid(), type, title, detail, done:false, createdAt:Date.now()});
    }
    closeModal(); render(); await saveKey('notes');
  });
}

document.getElementById('header-sub').textContent = HEADER_SUB.home;
</script>
