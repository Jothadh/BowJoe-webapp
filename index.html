<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JB">
<title>BowJoe</title>
<style>
  :root{
    --bg:#14181B; --card:#1E2327; --card2:#242A2E; --line:#2B3236;
    --ink:#ECEEF0; --ink-soft:#9AA3A8;
    --accent:#5EA8B8; --accent-soft:rgba(94,168,184,0.16);
    --gold:#D9A441; --gold-soft:rgba(217,164,65,0.16);
    --green:#4CAF6B; --green-soft:rgba(76,175,107,0.16);
    --danger:#E1604D; --danger-soft:rgba(225,96,77,0.18);
    --purple:#A481D9; --purple-soft:rgba(164,129,217,0.16);
    --pink:#E37FA0; --pink-soft:rgba(227,127,160,0.16);
    --blue:#5B8DEF; --blue-soft:rgba(91,141,239,0.16);
    --orange:#E0935A; --orange-soft:rgba(224,147,90,0.16);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:Georgia,"Noto Serif Thai",serif;font-weight:600;margin:0;}
  #app{
    padding-top: env(safe-area-inset-top); 
    padding-top: max(15px, env(safe-area-inset-top)); 
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    display:none;
  }
  .app-header{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 20px 10px;border-bottom:1px solid var(--line);}
  .app-header h1{font-size:21px;color:var(--ink);}
  .app-header p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  main{padding:16px 16px 8px;max-width:520px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .section-title{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--ink);}
  button{font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:9px 14px;cursor:pointer;}
  button.primary{background:var(--accent);color:#0F1416;border-color:var(--accent);font-weight:600;}
  button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px;}
  button.danger-ghost{background:transparent;border-color:transparent;color:var(--danger);padding:6px 8px;font-size:13px;}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);}
  input::placeholder,textarea::placeholder{color:var(--ink-soft);}
  label{font-size:12.5px;color:var(--ink-soft);display:block;margin:0 0 4px 3px;}
  .field{margin-bottom:12px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{flex:1;border:none;border-radius:0;background:var(--card2);}
  .seg button.active{background:var(--accent);color:#0F1416;font-weight:600;}
  .fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--accent);color:#0F1416;border:none;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.5);z-index:15;font-weight:700;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,24,27,0.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px);}
  .tabbar button{flex:1;border:none;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--ink-soft);font-size:10.5px;}
  .tabbar button.active{color:var(--accent);}
  .tabbar .icon{font-size:19px;}
  .tabbar .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .tabbar button.active .dot{background:var(--accent);}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .cat-food{background:var(--orange-soft);color:var(--orange);}
  .cat-shopping{background:var(--pink-soft);color:var(--pink);}
  .cat-home{background:var(--accent-soft);color:var(--accent);}
  .cat-personal{background:var(--purple-soft);color:var(--purple);}
  .cat-lifestyle{background:var(--green-soft);color:var(--green);}
  .cat-other{background:var(--card2);color:var(--ink-soft);}
  .person-joe{background:var(--blue-soft);color:var(--blue);}
  .person-bow{background:var(--pink-soft);color:var(--pink);}
  .person-tgt{background:var(--gold-soft);color:var(--gold);}
  .type-income{background:var(--green-soft);color:var(--green);}
  .type-expense{background:var(--danger-soft);color:var(--danger);}
  .empty{text-align:center;padding:32px 16px;color:var(--ink-soft);font-size:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;}
  .modal{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;border-top:1px solid var(--line);}
  .modal h3{margin-bottom:16px;font-size:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{flex:1;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-grid .dow{font-size:11px;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
  .cal-day{min-height:70px;border-radius:9px;font-size:12px;position:relative;padding:6px 3px;background:var(--card2);cursor:pointer;overflow:hidden;}
  .cal-day.other{background:transparent;color:#3A4247;}
  .cal-day.today{outline:1.5px solid var(--accent);}
  .cal-day .daynum{font-size:12px;font-weight:600;margin-bottom:2px;}
  .cal-day.today .daynum{color:var(--accent);}
  .cal-chip{font-size:9.5px;line-height:1.3;border-radius:4px;padding:3px 4px;margin-bottom:2px;white-space:normal;overflow:visible;text-overflow:ellipsis;}
  .cal-more{font-size:9.5px;color:var(--ink-soft);}
  .list-item{padding:11px 0;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .amount{font-weight:700;font-size:15px;}
  .sub-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .sub-tabs button{white-space:nowrap;padding:7px 13px;font-size:13px;}
  .sub-tabs button.active{background:var(--accent);color:#0F1416;border-color:var(--accent);font-weight:600;}
  .status{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:10px 0;}
  .metric{background:var(--card2);border-radius:var(--radius);padding:14px;border:1px solid var(--line);}
  .metric .num{font-size:20px;font-weight:700;color:var(--ink);}
  .metric .lab{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .badge-tenant{font-size:12px;color:var(--ink-soft);}
  .note-card{border-left:3px solid var(--line);padding-left:12px;}
  .note-card.urgent{border-left-color:var(--danger);}
  .cat-breakdown-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink-soft);}
  .cat-breakdown-row span:last-child{color:var(--ink);font-weight:600;}
  
  .notes-scroll{max-height:340px;overflow-y:auto;}
  .note-row-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
  .note-row-wrap:last-child{border-bottom:none;}
  .note-row{display:flex;justify-content:space-between;align-items:stretch;gap:8px;padding:8px 2px;background:var(--card);position:relative;z-index:1;transition:transform .18s ease;touch-action:pan-y;}
  .note-row.swiped{transform:translateX(-84px);}
  .note-row-delete{position:absolute;top:0;right:0;bottom:0;width:84px;background:var(--danger);color:#fff;border:none;font-size:13px;font-weight:600;}
  .note-row-complete{position:absolute;top:0;left:0;bottom:0;width:84px;background:var(--green);color:#fff;border:none;font-size:13px;font-weight:600;}
  .note-meta{font-size:11px;color:var(--ink-soft);}
  .note-title{font-weight:600;font-size:16px;margin-top:1px;}
  .note-detail{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:pre-wrap;}
  .note-actions{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex-shrink:0;}
  .star-btn{background:none;border:none;font-size:16px;padding:2px 4px;color:var(--ink-soft);line-height:1;}
  .star-btn.pinned{color:var(--gold);}
  .pin-section{border-bottom:1px dashed var(--line);margin-bottom:6px;padding-bottom:6px;}
  .list-item-compact{padding:6px 0;border-bottom:1px solid var(--line);}
  .list-item-compact:last-child{border-bottom:none;}
  
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
  .login-box{width:100%;max-width:340px;text-align:center;}
  .login-box h1{font-size:38px;margin-bottom:12px;color:var(--ink);}
  .login-box p{color:var(--ink-soft);font-size:16px;margin:0 0 12px;}
  .login-box input{text-align:center;letter-spacing:4px;font-size:18px;padding:12px;margin-bottom:20px;}
  .login-box button{width:100%;padding:14px;font-size:16px}
  .login-error{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:16px;}
</style>
<link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Bow Joe</h1>
    <p>Web App for Our Life</p>
    <div class="login-error" id="login-error"></div>
    <input type="password" inputmode="numeric" id="login-input" placeholder="our password <3">
    <button class="primary" id="login-btn">Login</button>
  </div>
</div>

<div id="app">
  <div class="app-header">
    <h1 id="header-title">Main</h1>
    <p id="header-sub">Today Pick </p>
  </div>
  <main id="main"></main>
  <button class="fab" id="fab" aria-label="Add Item">+</button>
  <div class="tabbar">
    <button data-tab="main" class="active"><span class="icon">📊</span><span>Main</span><span class="dot"></span></button>
    <button data-tab="calendar"><span class="icon">📅</span><span>Calendar</span><span class="dot"></span></button>
    <button data-tab="condo"><span class="icon">🏢</span><span>Condo</span><span class="dot"></span></button>
    <button data-tab="expenses"><span class="icon">💸</span><span>Expenses</span><span class="dot"></span></button>
    <button data-tab="notes"><span class="icon">📝</span><span>Notes</span><span class="dot"></span></button>
  </div>
</div>

<div id="modal-root"></div>

<script type="module">
// 1. เพิ่มชุดข้อความ Import ฟังก์ชันจาก Firebase เข้ามา
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// รหัสเชื่อมต่อพิกัดโปรเจกต์
const firebaseConfig = {
  apiKey: "AIzaSyCnT_QAPRaMyUe3TLy5lz2iHiBkGNn7OkM",
  authDomain: "bowjoe-webapps.firebaseapp.com",
  projectId: "bowjoe-webapps",
  storageBucket: "bowjoe-webapps.firebasestorage.app",
  messagingSenderId: "451821706693",
  appId: "1:451821706693:web:8d95cc1243d4bfb581ffac",
  measurementId: "G-6SD16J3BPN"
};

let fbDb = null;
let fbReady = false;

// 2. Initialize Firebase (ทำครั้งเดียวข้างในนี้พอ ไม่ต้องเรียก initializeApp ซ้ำด้านนอก
//    เพราะ Firebase จะโยน error "app already exists" ถ้าถูกเรียกซ้ำด้วย config เดิม)
const dbInitPromise = (async () => {
  if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    try {
      // ลงทะเบียนเปิดใช้งานแอปและดึงระบบย่อยออกมาทำงาน
      const fbApp = initializeApp(firebaseConfig);
      if (firebaseConfig.measurementId) {
        getAnalytics(fbApp);
      }
      
      fbDb = getFirestore(fbApp);
      const fbAuth = getAuth(fbApp);
      
      // ล็อกอินแบบระบุตัวตนนิรนามอัตโนมัติ
      await signInAnonymously(fbAuth);
      fbReady = true;
      console.log('Firebase Connected & Synced Successfully!');
    } catch (err) { 
      console.error('Firebase initialization failed:', err); 
      fbReady = false; 
    }
  }
})();

// 3. ฟังก์ชันดึงข้อมูลกลาง (ข้ามเครื่องผ่านคลาวด์ หากคลาวด์หลุดจะดึงจากเครื่องเก่าแทน)
async function dbGet(key) {
  await dbInitPromise;
  if (fbReady && fbDb) {
    try {
      const snap = await getDoc(doc(fbDb, 'familyapp', key));
      return snap.exists() ? snap.data().value : null;
    } catch (e) {
      console.error("Error reading data from cloud:", e);
    }
  }
  return localStorage.getItem('fam_' + key);
}

// 4. ฟังก์ชันบันทึกข้อมูลกลาง (บันทึกขึ้นคลาวด์ส่งข้อมูลข้ามเครื่องทันที)
async function dbSet(key, value) {
  await dbInitPromise;
  if (fbReady && fbDb) {
    try {
      await setDoc(doc(fbDb, 'familyapp', key), { value });
      return;
    } catch (e) {
      console.error("Error writing data to cloud:", e);
    }
  }
  localStorage.setItem('fam_' + key, value);
}

/* เปลี่ยนรหัสผ่านตรงนี้ได้เลย ให้ทั้งสองคนรู้รหัสเดียวกัน */
const PASSCODE = "089940";

const PEOPLE = [
  {id:'Joe', name:'Joe', cls:'person-joe'},
  {id:'Bow', name:'Bow', cls:'person-bow'},
  {id:'TGT', name:'Together', cls:'person-tgt'},
];
const EXP_CATS = [
  {id:'food', name:'Food', cls:'cat-food'},
  {id:'shopping', name:'Shopping', cls:'cat-shopping'},
  {id:'home', name:'Home', cls:'cat-home'},
  {id:'personal', name:'Personal', cls:'cat-personal'},
  {id:'lifestyle', name:'Lifestyle', cls:'cat-lifestyle'},
  {id:'other', name:'Other', cls:'cat-other'},
];
const HEADER_SUB = {
  main:'Today Pick', calendar:'Shared Schedule', condo:'The Origin Phahol 57:  B306  (24/240)',
  expenses:'Expense Records', notes:'Things to Remember and Do'
};
const HEADER_TITLE = { main:'Main', calendar:'Calendar', condo:'Condo', expenses:'Expenses', notes:'Notes' };

let state = { events:[], tenants:[], ledger:[], expenses:[], notes:[], rentStatus:{}, assets:[] };
let tab = 'main';
let condoSub = 'tenant';
let condoYear = new Date().getFullYear();
let calMonth = new Date();
let expenseSub = 'summary';
let expenseMonth = new Date();
let expenseListFilterCat = 'all';
let expenseListSort = 'date-desc';
let expenseListPersonFilter = 'all';
let notesSub = 'active';
let ready = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(d){ if(!d) return ''; return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}); }
function fmtTimeRange(e){
  if(!e.startTime && !e.endTime) return '';
  if(e.startTime && e.endTime) return `${e.startTime} - ${e.endTime} น.`;
  return `${e.startTime||e.endTime} น.`;
}
function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function thisMonthKey(){ return new Date().toISOString().slice(0,7); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function catInfo(list,id){ return list.find(c=>c.id===id) || list[list.length-1]; }
function personInfo(id){ return PEOPLE.find(p=>p.id===id) || PEOPLE[2]; }
function daysUntil(dateStr){ const d=new Date(dateStr+'T00:00:00'); const t=new Date(todayStr()+'T00:00:00'); return Math.round((d-t)/86400000); }
function expTotal(e){ return (Number(e.amounts&&e.amounts.Bow)||0) + (Number(e.amounts&&e.amounts.Joe)||0); }

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
function doLogin(){
  const v = document.getElementById('login-input').value;
   if(v === PASSCODE){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
   loadAll();
   }else{
    document.getElementById('login-error').textContent = 'Incorrect, Try again';
   } 
}

async function loadAll(){
  try{ const r = await dbGet('v2-events'); state.events = r ? JSON.parse(r) : []; }
  catch(e){ state.events = []; }
  state.events.forEach(ev=>{ if(!ev.person) ev.person = 'TGT'; });

  try{
    const r = await dbGet('v6-condo-tenants');
    if(r){ state.tenants = JSON.parse(r); }
    else{
      state.tenants = await migrateTenants();
      await saveKey('tenants');
    }
  }catch(e){ state.tenants = []; }

  try{ const r = await dbGet('v4-condo-rent'); state.rentStatus = r ? JSON.parse(r) : {}; }
  catch(e){ state.rentStatus = {}; }
  try{ const r = await dbGet('v4-condo-assets'); state.assets = r ? JSON.parse(r) : []; }
  catch(e){ state.assets = []; }

  try{
    const r = await dbGet('v3-condo-ledger');
    if(r){ state.ledger = JSON.parse(r); }
    else{
      state.ledger = await migrateCondoLedger();
      await saveKey('ledger');
    }
  }catch(e){ state.ledger = []; }

  try{ const r = await dbGet('v2-expenses'); state.expenses = r ? JSON.parse(r) : []; }
  catch(e){ state.expenses = []; }
  state.expenses.forEach(ex=>{
    if(!ex.amounts){
      const amt = Number(ex.amount)||0;
      if(ex.payer==='Bow') ex.amounts = {Bow:amt, Joe:0};
      else if(ex.payer==='Joe') ex.amounts = {Bow:0, Joe:amt};
      else ex.amounts = {Bow:amt/2, Joe:amt/2};
    }
    if(!ex.desc) ex.desc = ex.note || '';
  });

  try{
    const r = await dbGet('v3-notes');
    if(r){ state.notes = JSON.parse(r); }
    else{
      state.notes = await migrateNotes();
      await saveKey('notes');
    }
  }catch(e){ state.notes = []; }
  state.notes.forEach(n=>{ if(n.pinned===undefined) n.pinned=false; if(n.author==='TGT') n.author='Bow'; if(n.completed===undefined) n.completed=false; });
  ready = true;
  render();
}

async function migrateTenants(){
  try{
    const r = await dbGet('v2-condo-tenant');
    const old = r ? JSON.parse(r) : null;
    if(old && old.name){
      return [{ id:uid(), ...old, current:true, createdAt:Date.now() }];
    }
  }catch(e){}
  return [];
}

async function migrateCondoLedger(){
  let out = [];
  try{
    const ri = await dbGet('v2-condo-income');
    const inc = ri ? JSON.parse(ri) : [];
    inc.forEach(i=> out.push({id:uid(), type:'income', date:i.date||(i.month+'-01'), amount:i.amount, desc:i.note||('ค่าเช่าเดือน '+(i.month||'')), createdAt:i.createdAt||Date.now()}));
  }catch(e){}
  try{
    const rb = await dbGet('v2-condo-bills');
    const bills = rb ? JSON.parse(rb) : [];
    bills.forEach(b=> out.push({id:uid(), type:'expense', date:(b.month||thisMonthKey())+'-01', amount:b.amount, desc:(b.note||b.type||''), createdAt:b.createdAt||Date.now()}));
  }catch(e){}
  return out;
}
async function migrateNotes(){
  let out = [];
  try{
    const r = await dbGet('v2-notes');
    const old = r ? JSON.parse(r) : [];
    old.forEach(n=> out.push({id:n.id||uid(), title:n.title, detail:n.detail||'', author:'Bow', deadline:null, createdAt:n.createdAt||Date.now()}));
  }catch(e){}
  return out;
}

async function saveKey(k){
  const map = { events:'v2-events', tenants:'v6-condo-tenants', ledger:'v3-condo-ledger', expenses:'v2-expenses', notes:'v3-notes', rentStatus:'v4-condo-rent', assets:'v4-condo-assets' };
  try{ await dbSet(map[k], JSON.stringify(state[k])); }
  catch(e){ document.getElementById('header-sub').textContent = 'Saving failed. Please try again.'; }
}

document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tab = btn.dataset.tab;
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('header-title').textContent = HEADER_TITLE[tab];
    document.getElementById('header-sub').textContent = HEADER_SUB[tab];
    render();
  });
});
document.getElementById('fab').addEventListener('click', ()=>{
  if(tab==='calendar') openEventModal(todayStr());
  else if(tab==='condo'){
    if(condoSub==='tenant') openTenantModal();
    else if(condoSub==='expense') openLedgerModal();
    else if(condoSub==='assets') openAssetModal();
  }
  else if(tab==='expenses') openExpenseModal();
  else if(tab==='notes') openNoteModal();
});

function render(){
  const main = document.getElementById('main');
  document.getElementById('fab').style.display = (tab==='main' || (tab==='condo' && condoSub==='income') || (tab==='notes' && notesSub==='completed')) ? 'none' : 'flex';
  if(!ready){ main.innerHTML = '<div class="status">Loading...</div>'; return; }
  if(tab==='main') main.innerHTML = renderHome();
  else if(tab==='calendar') main.innerHTML = renderCalendar();
  else if(tab==='condo') main.innerHTML = renderCondo();
  else if(tab==='expenses') main.innerHTML = renderExpenses();
  else main.innerHTML = renderNotes();
  attachDynamicListeners();
}

    <div style="min-height:65vh;display:flex;align-items:center;justify-content:center;text-align:center;">

/* ---------- CALENDAR ---------- */
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1), startOffset=first.getDay(), daysInMonth=new Date(y,m+1,0).getDate();
  const monthLabel = calMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = todayStr();
  let cells='';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day other"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = state.events.filter(e=>e.date===dateStr).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const shown = dayEvents.slice(0,2);
    const extra = dayEvents.length - shown.length;
    cells += `<div class="cal-day ${dateStr===today?'today':''}" data-day="${dateStr}">
      <div class="daynum">${d}</div>
      ${shown.map(e=>`<div class="cal-chip ${personInfo(e.person).cls}">${e.startTime?escapeHtml(e.startTime)+' ':''}${escapeHtml(e.title)}</div>`).join('')}
      ${extra>0?`<div class="cal-more">+${extra} more</div>`:''}
    </div>`;
  }
  const todayEvents = state.events.filter(e=>e.date===today).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')).slice(0,2);
  const nextEvents = state.events.filter(e=>e.date>today)
    .sort((a,b)=> a.date===b.date ? (a.startTime||'').localeCompare(b.startTime||'') : a.date.localeCompare(b.date))
    .slice(0,2);

  function miniEvent(e, showDate){
    const timeStr = fmtTimeRange(e);
    const firstLine = showDate
      ? `<span style="font-weight:700;font-size:14px;">${escapeHtml(fmtDate(e.date))}</span>${timeStr?`<br> <span class="muted" style="font-size:11.5px;">${escapeHtml(timeStr)}</span>`:''}`
      : (timeStr?`<span style="font-weight:700;font-size:14px;">${escapeHtml(timeStr)}</span>`:'');
    return `<div class="list-item-compact"><div class="row" style="align-items:flex-start;">
      <div>
        ${firstLine?`<div>${firstLine}</div>`:''}
        <div style="font-weight:600;font-size:13px;margin-top:2px;">${escapeHtml(e.title)}</div>
        ${e.note?`<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(e.note)}</div>`:''}
      </div>
      <span class="pill ${personInfo(e.person).cls}" style="font-size:10px;padding:1px 6px;flex-shrink:0;">${personInfo(e.person).name}</span>
    </div></div>`;
  }

  return `
    <div class="card">
      <div class="row" style="margin-bottom:12px;">
        <button class="ghost" id="prev-month">‹ Previous</button>
        <h3>${monthLabel}</h3>
        <button class="ghost" id="next-month">Next ›</button>
      </div>
      <div class="cal-grid">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">Today Event</div>
        ${todayEvents.length ? todayEvents.map(e=>miniEvent(e,false)).join('') : `<div class="empty" style="padding:16px 8px;">No events today</div>`}
      </div>
      <div class="card">
        <div class="section-title">Upcoming Event</div>
        ${nextEvents.length ? nextEvents.map(e=>miniEvent(e,true)).join('') : `<div class="empty" style="padding:16px 8px;">No upcoming events</div>`}
      </div>
    </div>
  `;
}

      <div class="section-title" style="margin:14px 4px 8px;">Renter History</div>

        <div class="card" style="padding:10px 14px;">
          <div class="row">
            <div>
              <div style="font-weight:600;font-size:13px;">${escapeHtml(t.name)}</div>
              <div class="muted" style="font-size:11px;">${fmtDate(t.leaseStart)||'-'} – ${fmtDate(t.leaseEnd)||'-'}</div>

function renderCondoIncome(){
  const yearPrefix = String(condoYear);
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let paidCount=0, income=0;
  const rows = monthNames.map((mName,idx)=>{
    const mk = `${yearPrefix}-${String(idx+1).padStart(2,'0')}`;
    const rec = state.rentStatus[mk];
    const paid = !!(rec && rec.paid);
    if(paid){ paidCount++; income += Number(rec.amount)||0; }
    return `<div style="display:grid;grid-template-columns:38px 64px 1fr 82px;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;">
      <div style="font-weight:600;">${mName}</div>
      <button class="pill" data-open-rent="${mk}" style="border:none;cursor:pointer;font-size:11px;padding:2px 6px;background:${paid?'var(--green-soft)':'var(--card2)'};color:${paid?'var(--green)':'var(--ink-soft)'};">${paid?'Paid':'Unpaid'}</button>
      <div style="text-align:right;">${paid?'฿'+fmtMoney(rec.amount):'-'}</div>
      <div class="muted" style="text-align:right;">${paid&&rec.datePaid?fmtDate(rec.datePaid):'-'}</div>
    </div>`;
  }).join('');
  const yearExpense = state.ledger.filter(l=>l.date && l.date.slice(0,4)===yearPrefix).reduce((s,l)=>s+Number(l.amount),0);
  const net = income - yearExpense;
  return `
    <div class="row" style="margin-bottom:8px;">
      <button class="ghost" data-year-nav="-1">‹ ${condoYear-1}</button>
      <h3>${condoYear}</h3>
      <button class="ghost" data-year-nav="1">${condoYear+1} ›</button>
    </div>
    <div class="grid3" style="margin-bottom:8px;">
      <div class="metric"><div class="num" style="color:var(--green);font-size:16px;">฿${fmtMoney(income)}</div><div class="lab">Rent Collected</div></div>
      <div class="metric"><div class="num" style="color:var(--danger);font-size:16px;">฿${fmtMoney(yearExpense)}</div><div class="lab">Expenses</div></div>
      <div class="metric"><div class="num" style="font-size:16px;color:${net>=0?'var(--green)':'var(--danger)'};">฿${fmtMoney(net)}</div><div class="lab">Net</div></div>
    </div>
    <div class="card" style="padding:10px 14px;">
      <div class="section-title" style="margin-bottom:2px;">Rent Status — ${paidCount}/12 months paid</div>
      ${rows}
    </div>
  `;
}

function renderExpenseList(){
  const y=expenseMonth.getFullYear(), m=expenseMonth.getMonth();
  const mk = `${y}-${String(m+1).padStart(2,'0')}`;
  const monthLabel = expenseMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let items = state.expenses.filter(e=>e.date && e.date.slice(0,7)===mk);
  if(expenseListFilterCat!=='all') items = items.filter(e=>e.category===expenseListFilterCat);
  if(expenseListPersonFilter!=='all') items = items.filter(e=>Number(e.amounts && e.amounts[expenseListPersonFilter])>0);
  const sorted = [...items].sort((a,b)=>{
    if(expenseListSort==='amount-desc') return expTotal(b)-expTotal(a);
    if(expenseListSort==='amount-asc') return expTotal(a)-expTotal(b);
    if(expenseListSort==='date-asc') return a.date.localeCompare(b.date);
    return b.date.localeCompare(a.date);
  });

  return `
    <div class="row" style="margin-bottom:10px;">
      <button class="ghost" data-exp-month-nav="-1">‹</button>
      <h3 style="font-size:16px;">${monthLabel}</h3>
      <button class="ghost" data-exp-month-nav="1">›</button>
    </div>
    <div class="row" style="margin-bottom:8px;gap:8px;">
      <select id="exp-filter-cat" style="width:auto;flex:1;">
        <option value="all" ${expenseListFilterCat==='all'?'selected':''}>All Categories</option>
        ${EXP_CATS.map(c=>`<option value="${c.id}" ${expenseListFilterCat===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="row" style="margin-bottom:10px;gap:8px;">
      <select id="exp-sort" style="width:auto;flex:1;">
        <option value="date-desc" ${expenseListSort==='date-desc'?'selected':''}>Date (Newest first)</option>
        <option value="date-asc" ${expenseListSort==='date-asc'?'selected':''}>Date (Oldest first)</option>
        <option value="amount-desc" ${expenseListSort==='amount-desc'?'selected':''}>Amount (High to Low)</option>
        <option value="amount-asc" ${expenseListSort==='amount-asc'?'selected':''}>Amount (Low to High)</option>
      </select>
      <select id="exp-filter-person" style="width:auto;flex:1;">
        <option value="all" ${expenseListPersonFilter==='all'?'selected':''}>All</option>
        <option value="Bow" ${expenseListPersonFilter==='Bow'?'selected':''}>Bow</option>
        <option value="Joe" ${expenseListPersonFilter==='Joe'?'selected':''}>Joe</option>
      </select>
    </div>
    <div class="card">
      ${sorted.length ? sorted.map(e=>{
        const c = catInfo(EXP_CATS,e.category);
        const bow = Number(e.amounts&&e.amounts.Bow)||0, joe = Number(e.amounts&&e.amounts.Joe)||0;
        return `<div class="note-row-wrap">
          <button class="note-row-delete" data-swipe-del-expense="${e.id}">Delete</button>
          <div class="note-row" data-expense-row="${e.id}">
          <div>
            <div class="muted">${fmtDate(e.date)}</div>
            <div style="margin-top:2px;font-size:13px;font-weight:600;"><span class="pill ${c.cls}" style="margin-right:6px;">${c.name}</span>${escapeHtml(e.desc||'-')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11px;">
              ${bow?`<span style="color:var(--pink);font-weight:600;">Bow ฿${fmtMoney(bow)}</span>`:''}
              ${bow&&joe?' · ':''}
              ${joe?`<span style="color:var(--blue);font-weight:600;">Joe ฿${fmtMoney(joe)}</span>`:''}
            </div>
            <div class="amount" style="font-size:16px;margin-top:2px;">฿${fmtMoney(bow+joe)}</div>
          </div>
          </div>
        </div>`;
      }).join('') : `<div class="empty">No data yet</div>`}
    </div>
  `;
}

/* ---------- NOTES ---------- */
function renderNotes(){
  const subs = [{id:'active',name:'To Do'},{id:'completed',name:'Completed'}];
  const pool = state.notes.filter(n => notesSub==='active' ? !n.completed : !!n.completed);
  const pinned = notesSub==='active' ? pool.filter(n=>n.pinned).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,2) : [];
  const pinnedIds = new Set(pinned.map(n=>n.id));
  const rest = pool.filter(n=>!pinnedIds.has(n.id)).sort((a,b)=>{
    const da = a.deadline || '9999-99-99', db = b.deadline || '9999-99-99';
    if(da!==db) return da.localeCompare(db);
    return (b.createdAt||0)-(a.createdAt||0);
  });

  function noteRow(n){
    const urgent = n.deadline && daysUntil(n.deadline)<=3;
    const p = personInfo(n.author);
    return `
    <div class="note-row-wrap">
      <button class="note-row-complete" data-complete-note="${n.id}">${n.completed?'Restore':'Complete'}</button>
      <button class="note-row-delete" data-swipe-del="${n.id}">Delete</button>
      <div class="note-row" data-note-row="${n.id}">
        <div>
          <div class="note-title">${escapeHtml(n.title)}</div>
          ${n.detail?`<div class="note-detail">${escapeHtml(n.detail)}</div>`:''}
          ${n.deadline?`<div class="note-meta" style="margin-top:4px;color:${urgent?'var(--danger)':'var(--ink-soft)'};">Due ${fmtDate(n.deadline)}</div>`:''}
        </div>
        <div class="note-actions">
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="star-btn ${n.pinned?'pinned':''}" data-pin-note="${n.id}">${n.pinned?'★':'☆'}</button>
            <span class="pill ${p.cls}">${p.name}</span>
          </div>
          <button class="ghost" data-edit-note="${n.id}" style="padding:2px 6px;font-size:12px;">Edit</button>
        </div>
      </div>
    </div>`;
  }

  return `
    <div class="sub-tabs">${subs.map(s=>`<button data-notes-sub="${s.id}" class="${s.id===notesSub?'active':''}">${s.name}</button>`).join('')}</div>
    <div class="card">
      ${pinned.length ? `<div class="pin-section">${pinned.map(noteRow).join('')}</div>` : ''}
      <div class="notes-scroll">
        ${rest.length ? rest.map(noteRow).join('') : (pinned.length ? '' : `<div class="empty">${notesSub==='active'?'Nothing to do — add a note or swipe one here from Completed':'No completed items yet'}</div>`)}
      </div>
    </div>
  `;
}

/* ---------- LISTENERS ---------- */
function attachDynamicListeners(){
  const prev=document.getElementById('prev-month'), next=document.getElementById('next-month');
  if(prev) prev.addEventListener('click', ()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); });
  if(next) next.addEventListener('click', ()=>{ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); });
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click', ()=> openDayModal(el.dataset.day)));

  document.querySelectorAll('[data-expense-sub]').forEach(b=>b.addEventListener('click', ()=>{ expenseSub=b.dataset.expenseSub; render(); }));
  document.querySelectorAll('[data-exp-month-nav]').forEach(b=>b.addEventListener('click', ()=>{
    expenseMonth = new Date(expenseMonth.getFullYear(), expenseMonth.getMonth()+parseInt(b.dataset.expMonthNav,10), 1); render();
  }));
  const filterSel = document.getElementById('exp-filter-cat');
  if(filterSel) filterSel.addEventListener('change', ()=>{ expenseListFilterCat = filterSel.value; render(); });
  const sortSel = document.getElementById('exp-sort');
  if(sortSel) sortSel.addEventListener('change', ()=>{ expenseListSort = sortSel.value; render(); });
  const personSel = document.getElementById('exp-filter-person');
  if(personSel) personSel.addEventListener('change', ()=>{ expenseListPersonFilter = personSel.value; render(); });

  document.querySelectorAll('[data-condo-sub]').forEach(b=>b.addEventListener('click', ()=>{ condoSub=b.dataset.condoSub; render(); }));
  document.querySelectorAll('[data-edit-tenant]').forEach(b=>b.addEventListener('click', ()=>{
    openTenantModal(state.tenants.find(t=>t.id===b.dataset.editTenant));
  }));
  document.querySelectorAll('[data-year-nav]').forEach(b=>b.addEventListener('click', ()=>{
    condoYear += parseInt(b.dataset.yearNav,10); render();
  }));
  document.querySelectorAll('[data-open-rent]').forEach(b=>b.addEventListener('click', ()=>{
    const mk = b.dataset.openRent;
    const rec = state.rentStatus[mk];
    if(rec && rec.paid) openConfirmDeleteRent(mk);
    else openRentModal(mk);
  }));
  document.querySelectorAll('[data-del-asset]').forEach(b=>b.addEventListener('click', async ()=>{
    state.assets = state.assets.filter(a=>a.id!==b.dataset.delAsset); render(); await saveKey('assets');
  }));

  document.querySelectorAll('[data-del-ledger]').forEach(b=>b.addEventListener('click', async ()=>{
    state.ledger = state.ledger.filter(l=>l.id!==b.dataset.delLedger); render(); await saveKey('ledger');
  }));
  document.querySelectorAll('[data-swipe-del-expense]').forEach(b=>b.addEventListener('click', async ()=>{
    state.expenses = state.expenses.filter(e=>e.id!==b.dataset.swipeDelExpense); render(); await saveKey('expenses');
  }));
  document.querySelectorAll('[data-notes-sub]').forEach(b=>b.addEventListener('click', ()=>{ notesSub=b.dataset.notesSub; render(); }));
  document.querySelectorAll('[data-swipe-del]').forEach(b=>b.addEventListener('click', async ()=>{
    state.notes = state.notes.filter(n=>n.id!==b.dataset.swipeDel); render(); await saveKey('notes');
  }));
  document.querySelectorAll('[data-complete-note]').forEach(b=>b.addEventListener('click', async ()=>{
    const n = state.notes.find(x=>x.id===b.dataset.completeNote);
    if(!n) return;
    n.completed = !n.completed;
    render(); await saveKey('notes');
  }));
  document.querySelectorAll('[data-edit-note]').forEach(b=>b.addEventListener('click', ()=>{
    openNoteModal(state.notes.find(n=>n.id===b.dataset.editNote));
  }));
  document.querySelectorAll('[data-pin-note]').forEach(b=>b.addEventListener('click', async ()=>{
    const n = state.notes.find(x=>x.id===b.dataset.pinNote);
    if(!n) return;
    if(!n.pinned && state.notes.filter(x=>x.pinned).length>=2){
      alert('You can pin up to 2 notes only. Unpin one first.');
      return;
    }
    n.pinned = !n.pinned;
    render(); await saveKey('notes');
  }));
  document.querySelectorAll('[data-note-row]').forEach(row=>{
    let startX=0, dx=0, dragging=false;
    row.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; dragging=true; dx=0; });
    row.addEventListener('touchmove', e=>{
      if(!dragging) return;
      dx = e.touches[0].clientX - startX;
      if(dx>90) dx=90; if(dx<-90) dx=-90;
      row.style.transform = `translateX(${dx}px)`;
    });
    row.addEventListener('touchend', ()=>{
      dragging=false;
      if(dx < -40){ row.style.transform='translateX(-84px)'; row.classList.add('swiped'); row.classList.remove('swiped-right'); }
      else if(dx > 40){ row.style.transform='translateX(84px)'; row.classList.add('swiped-right'); row.classList.remove('swiped'); }
      else{ row.style.transform=''; row.classList.remove('swiped','swiped-right'); }
    });
    row.addEventListener('click', ()=>{
      if(row.classList.contains('swiped')||row.classList.contains('swiped-right')){
        row.style.transform=''; row.classList.remove('swiped','swiped-right');
      }
    });
  });

  document.querySelectorAll('[data-expense-row]').forEach(row=>{
    let startX=0, dx=0, dragging=false;
    row.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; dragging=true; dx=0; });
    row.addEventListener('touchmove', e=>{
      if(!dragging) return;
      dx = e.touches[0].clientX - startX;
      if(dx>0) dx=0; if(dx<-90) dx=-90;
      row.style.transform = `translateX(${dx}px)`;
    });
    row.addEventListener('touchend', ()=>{
      dragging=false;
      if(dx < -40){ row.style.transform='translateX(-84px)'; row.classList.add('swiped'); }
      else{ row.style.transform=''; row.classList.remove('swiped'); }
    });
    row.addEventListener('click', ()=>{
      if(row.classList.contains('swiped')){ row.style.transform=''; row.classList.remove('swiped'); }
    });
  });
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>${fmtDate(dateStr)}</h3>
      ${dayEvents.length ? dayEvents.map(e=>`
        <div class="list-item"><div class="row" style="align-items:flex-start;">
          <div><span class="pill ${personInfo(e.person).cls}">${personInfo(e.person).name}</span>
            ${(e.startTime||e.endTime)?`<span class="muted" style="margin-left:6px;">${escapeHtml(fmtTimeRange(e))}</span>`:''}
            <div style="margin-top:5px;font-weight:600;">${escapeHtml(e.title)}</div>
            ${e.note?`<div class="muted">${escapeHtml(e.note)}</div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
            <button class="ghost" data-edit-day-event="${e.id}">Edit</button>
            <button class="danger-ghost" data-del-day-event="${e.id}">Delete</button>
          </div>
        </div></div>
      `).join('') : `<div class="empty">No data yet</div>`}
      <div class="modal-actions" style="margin-top:14px;">
        <button id="day-close">Close</button>
        <button class="primary" id="day-add">+ Add Event</button>
      </div>
    </div></div>`;
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('day-close').addEventListener('click', closeModal);
  document.getElementById('day-add').addEventListener('click', ()=> openEventModal(dateStr));
  document.querySelectorAll('[data-edit-day-event]').forEach(b=>b.addEventListener('click', ()=>{
    openEventModal(dateStr, state.events.find(e=>e.id===b.dataset.editDayEvent));
  }));
  document.querySelectorAll('[data-del-day-event]').forEach(b=>b.addEventListener('click', async ()=>{
    state.events = state.events.filter(e=>e.id!==b.dataset.delDayEvent);
    closeModal(); render(); await saveKey('events');
  }));
}

function openEventModal(defaultDate, existing){
  const isEdit = !!existing;
  const e0 = existing || { date:defaultDate||todayStr(), title:'', startTime:'', endTime:'', note:'', person:'TGT' };
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>${isEdit?'Edit Event':'Add Event'}</h3>
      <div class="field"><label>Date</label><input type="date" id="ev-date" value="${e0.date}"></div>
      <div class="field"><label>Subject</label><input type="text" id="ev-title" value="${escapeHtml(e0.title)}" placeholder="e.g., Pay condo fee, Doctor appointment"></div>
      <div class="row" style="gap:10px;">
        <div class="field" style="flex:1;"><label>Start time (optional)</label><input type="text" id="ev-start" inputmode="numeric" placeholder="13:00" maxlength="5" value="${e0.startTime||''}"></div>
        <div class="field" style="flex:1;"><label>End time (optional)</label><input type="text" id="ev-end" inputmode="numeric" placeholder="15:00" maxlength="5" value="${e0.endTime||''}"></div>
      </div>
      <div class="field"><label>Assigned to</label>
        <div class="seg" id="ev-person-seg">${PEOPLE.map(p=>`<button type="button" data-val="${p.id}" class="${p.id===e0.person?'active':''}">${p.name}</button>`).join('')}</div>
      </div>
      <div class="field"><label>Additional Notes (Optional)</label><textarea id="ev-note" rows="2">${escapeHtml(e0.note||'')}</textarea></div>
      <div id="ev-error" class="muted" style="color:var(--danger);display:none;">Please fill in the date and subject</div>
      <div class="modal-actions">
        ${isEdit?`<button class="danger-ghost" id="ev-delete" style="flex:none;">Delete</button>`:''}
        <button id="ev-cancel">Cancel</button><button class="primary" id="ev-save">Save</button>
      </div>
    </div></div>`;
  let selectedPerson = e0.person;
  document.querySelectorAll('#ev-person-seg button').forEach(b=>b.addEventListener('click', ()=>{
    selectedPerson = b.dataset.val;
    document.querySelectorAll('#ev-person-seg button').forEach(x=>x.classList.toggle('active', x===b));
  }));
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('ev-cancel').addEventListener('click', closeModal);
  const delBtn = document.getElementById('ev-delete');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    state.events = state.events.filter(ev=>ev.id!==existing.id);
    closeModal(); render(); await saveKey('events');
  });
  document.getElementById('ev-save').addEventListener('click', async ()=>{
    const date=document.getElementById('ev-date').value, title=document.getElementById('ev-title').value.trim();
    if(!date||!title){ document.getElementById('ev-error').style.display='block'; return; }
    const startTime = document.getElementById('ev-start').value;
    const endTime = document.getElementById('ev-end').value;
    const note = document.getElementById('ev-note').value.trim();
    if(isEdit){
      existing.date=date; existing.title=title; existing.startTime=startTime; existing.endTime=endTime;
      existing.note=note; existing.person=selectedPerson;
    } else {
      state.events.push({id:uid(), date, title, startTime, endTime, note, person:selectedPerson, createdAt:Date.now()});
    }
    closeModal(); render(); await saveKey('events');
  });
}

function openTenantModal(existing){
  const isEdit = !!existing;
  const t = existing || {};
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" id="modal-bg"><div class="modal">
      <h3>${isEdit?'Edit Renter':'Add Renter'}</h3>
      <div class="field"><label>Renter Name</label><input type="text" id="tn-name" value="${escapeHtml(t.name||'')}"></div>
      <div class="field"><label>Phone Number</label><input type="text" id="tn-phone" value="${escapeHtml(t.phone||'')}"></div>
      <div class="field"><label>Monthly Rent (THB)</label><input type="number" id="tn-rent" value="${t.rent||''}"></div>
      <div class="field"><label>Security Deposit (THB)</label><input type="number" id="tn-deposit" value="${t.deposit||''}"></div>
      <div class="field"><label>Lease Start Date</label><input type="date" id="tn-start" value="${t.leaseStart||''}"></div>
      <div class="field"><label>Lease End Date</label><input type="date" id="tn-end" value="${t.leaseEnd||''}"></div>
      <div class="field"><label>Is this the current renter?</label>
        <div class="seg" id="tn-current-seg">
          <button type="button" data-val="yes" class="${t.current!==false?'active':''}">Yes</button>
          <button type="button" data-val="no" class="${t.current===false?'active':''}">No (moved out)</button>
        </div>
      </div>
      <div class="field"><label>Deposit Refunded?</label>
        <div class="seg" id="tn-deposit-seg">
          <button type="button" data-val="no" class="${!t.depositReturned?'active':''}">Not yet</button>
          <button type="button" data-val="yes" class="${t.depositReturned?'active':''}">Returned</button>
        </div>
      </div>
      <div class="field"><label>Refund Date</label><input type="date" id="tn-deposit-date" value="${t.depositReturnDate||''}"></div>
      <div class="field"><label>Refund Amount (THB)</label><input type="number" id="tn-deposit-amount" value="${t.depositReturnAmount||''}"></div>
      <div class="modal-actions">
        ${isEdit?`<button class="danger-ghost" id="tn-delete" style="flex:none;">Delete</button>`:''}
        <button id="tn-cancel">Cancel</button><button class="primary" id="tn-save">Save</button>
      </div>
    </div></div>`;
  let depositReturned = !!t.depositReturned;
  let isCurrent = t.current !== false;
  document.querySelectorAll('#tn-deposit-seg button').forEach(b=>b.addEventListener('click', ()=>{
    depositReturned = b.dataset.val==='yes';
    document.querySelectorAll('#tn-deposit-seg button').forEach(x=>x.classList.toggle('active', x===b));
  }));
  document.querySelectorAll('#tn-current-seg button').forEach(b=>b.addEventListener('click', ()=>{
    isCurrent = b.dataset.val==='yes';
    document.querySelectorAll('#tn-current-seg button').forEach(x=>x.classList.toggle('active', x===b));
  }));
  document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('tn-cancel').addEventListener('click', closeModal);
  const delBtn = document.getElementById('tn-delete');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    state.tenants = state.tenants.filter(x=>x.id!==existing.id);
    closeModal(); render(); await saveKey('tenants');
  });
  document.getElementById('tn-save').addEventListener('click', async ()=>{
    const fields = {
      name: document.getElementById('tn-name').value.trim(),
      phone: document.getElementById('tn-phone').value.trim(),
      rent: parseFloat(document.getElementById('tn-rent').value)||0,
      deposit: parseFloat(document.getElementById('tn-deposit').value)||0,
      leaseStart: document.getElementById('tn-start').value,
      leaseEnd: document.getElementById('tn-end').value,
      depositReturned,
      depositReturnDate: document.getElementById('tn-deposit-date').value,
      depositReturnAmount: parseFloat(document.getElementById('tn-deposit-amount').value)||0,
      current: isCurrent
    };
    if(isCurrent) state.tenants.forEach(x=>{ if(!isEdit || x.id!==existing.id) x.current=false; });
    if(isEdit){ Object.assign(existing, fields); }
    else{ state.tenants.push({ id:uid(), ...fields, createdAt:Date.now() }); }
    closeModal(); render(); await saveKey('tenants');
  });
}
